# Tests run against in-memory H2 so the suite needs no Docker and stays fast.
# Flyway is disabled here because the baseline migration is Postgres-specific;
# Hibernate builds the schema from the same entity mappings that
# `ddl-auto: validate` checks the real migration against.
spring:
  datasource:
    url: jdbc:h2:mem:schemavc-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000

app:
  cors:
    allowed-origins: "*"

logging:
  level:
    root: WARN
    com.schema.versioncontrol: WARN
