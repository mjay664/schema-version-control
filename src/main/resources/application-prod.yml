# Applied on Render via SPRING_PROFILES_ACTIVE=prod.
spring:
  main:
    # Defer bean creation until first use – cuts cold-start time on
    # Render's memory-constrained free instances.
    lazy-initialization: true
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.schema.versioncontrol: INFO
    org.hibernate.SQL: WARN
