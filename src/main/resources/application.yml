# Defaults target the Postgres started by docker-compose, which publishes on
# 55432 to avoid colliding with a native Postgres on 5432. Inside the compose
# network the api service overrides DB_HOST/DB_PORT to db:5432.
#
# Every value that differs between machines or deployments is env-overridable,
# so the same image runs locally and on Render with only the environment
# changing.
server:
  port: ${PORT:8080}

spring:
  application:
    name: schema-version-control

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:schemavc}
    username: ${DB_USER:schemavc}
    password: ${DB_PASSWORD:schemavc}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Render's free Postgres allows few connections; leave headroom for psql.
      maximum-pool-size: ${DB_POOL_MAX:5}
      connection-timeout: 30000

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks the mapping matches it.
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

jwt:
  # Overridden in every deployment. The application refuses to start on a
  # non-local profile while this default is still in place.
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    # Comma-separated origins. "*" is fine locally; Render sets the real origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.schema.versioncontrol: ${LOG_LEVEL:INFO}
