# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys three things: a Postgres database, the Spring Boot API as a Docker
# web service, and the Vite frontend as a static site.
#
# To deploy: push this repo to GitHub, then in Render choose
# New > Blueprint and point it at the repository.
#
# Free tier caveats, both of which bite in practice:
#   * A free Postgres instance is REMOVED about 30 days after creation. Back up
#     anything you care about, or move the database to a paid plan.
#   * Free web services sleep after 15 minutes idle. The first request afterwards
#     waits ~50s for a JVM cold start, which looks like the app being broken.

databases:
  - name: schema-vc-db
    databaseName: schemavc
    user: schemavc
    plan: free

services:
  # ---- API -------------------------------------------------------------
  - type: web
    name: schema-vc-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Assembled from the database's own connection details rather than its
      # connection string, because Spring needs a jdbc: URL and the blueprint
      # cannot rewrite one.
      - key: DB_HOST
        fromDatabase:
          name: schema-vc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: schema-vc-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: schema-vc-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: schema-vc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: schema-vc-db
          property: password

      # Generated once by Render and then held stable. Rotating it invalidates
      # every issued token, signing all users out.
      - key: JWT_SECRET
        generateValue: true

      # Locked to the frontend's own origin. Set this by hand after the first
      # deploy if you attach a custom domain.
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: schema-vc-web
          type: web
          property: hostport

      # Free Postgres permits few connections; leave room for psql and backups.
      - key: DB_POOL_MAX
        value: "5"

  # ---- Frontend --------------------------------------------------------
  - type: web
    name: schema-vc-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Inlined at build time, so changing the API address needs a redeploy.
      - key: VITE_API_BASE_URL
        value: https://schema-vc-api.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # The app is a single page with no client-side router, but this keeps any
      # stray deep link resolving instead of 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
